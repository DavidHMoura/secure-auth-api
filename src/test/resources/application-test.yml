security:
  jwt:
    secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    access-expiration-seconds: 900
    refresh-expiration-seconds: 604800
    issuer: secure-auth-api

spring:
  datasource:
    url: jdbc:h2:mem:secureauth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
