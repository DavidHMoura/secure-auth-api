security:
  jwt:
    secret: ${JWT_SECRET:dev-test-secret-change-me-please-dev-test-secret-change-me-please}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    issuer: ${JWT_ISSUER:secure-auth-api}

spring:
  datasource:
    url: jdbc:h2:mem:secureauth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  main:
    banner-mode: "off"

logging:
  level:
    root: WARN
