security:
  jwt:
    secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    access-expiration-seconds: 900
    refresh-expiration-seconds: 604800
    issuer: secure-auth-api-test

spring:
  datasource:
    url: jdbc:h2:mem:secureauth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  flyway:
    enabled: false

logging:
  level:
    root: WARN
