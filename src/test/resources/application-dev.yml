security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    issuer: ${JWT_ISSUER:secure-auth-api}

spring:
  datasource:
    url: jdbc:h2:mem:secureauth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  flyway:
    enabled: false
